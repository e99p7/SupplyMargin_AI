[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supplymargin-ai"
version = "1.4.0"
description = "Demand, landed-cost, procurement and retail price optimizer"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "prometheus-client>=0.21,<1",
  "openpyxl>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.9,<3",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
]

[tool.setuptools.packages.find]
include = ["supplymargin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
