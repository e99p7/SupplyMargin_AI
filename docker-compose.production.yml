services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supplymargin
      POSTGRES_USER: supplymargin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplymargin -d supplymargin"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks: [internal]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
        mc mb --ignore-existing local/supplymargin-production &&
        mc anonymous set none local/supplymargin-production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      SUPPLYMARGIN_ENV: production
      SUPPLYMARGIN_APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
      SUPPLYMARGIN_CORS_ORIGINS: https://${DOMAIN}
      SUPPLYMARGIN_COOKIE_SECURE: "true"
      SUPPLYMARGIN_DATABASE_URL: postgresql+psycopg://supplymargin:${POSTGRES_PASSWORD}@postgres:5432/supplymargin
      SUPPLYMARGIN_STORAGE_BACKEND: s3
      SUPPLYMARGIN_S3_ENDPOINT_URL: http://minio:9000
      SUPPLYMARGIN_S3_REGION: ru-1
      SUPPLYMARGIN_S3_BUCKET: supplymargin-production
      SUPPLYMARGIN_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      SUPPLYMARGIN_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SUPPLYMARGIN_S3_SSE: ""
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "supplymargin.worker"]
    env_file: [.env]
    environment:
      SUPPLYMARGIN_ENV: production
      SUPPLYMARGIN_DATABASE_URL: postgresql+psycopg://supplymargin:${POSTGRES_PASSWORD}@postgres:5432/supplymargin
      SUPPLYMARGIN_STORAGE_BACKEND: s3
      SUPPLYMARGIN_S3_ENDPOINT_URL: http://minio:9000
      SUPPLYMARGIN_S3_REGION: ru-1
      SUPPLYMARGIN_S3_BUCKET: supplymargin-production
      SUPPLYMARGIN_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      SUPPLYMARGIN_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SUPPLYMARGIN_S3_SSE: ""
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    logging:
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
